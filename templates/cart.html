<!DOCTYPE html>
<html>
<head>
    <title>E-Commerce</title>
    <link rel="stylesheet" href="/static/css/index.css">
</head>
<body>
    <header>
        <!-- logo -->
        <nav>
            <div class="logo">
                <a href="/shop">Pagal Cart</a>
            </div>
            <!-- search bar -->
            <div class="search-Container">
                <input type="text" placeholder="Search Products">

            </div>
            <div class="nav-links">
                <a href="/cart" class="cart-icon">🛒</a>
                
                <!-- show when not logged in -->
                <a href="/login" class="login-btn" id="login-link">Login</a>
                
                <!-- show when logged in -->
                <div class="profile-container" id="profile-container" style="display:none">
                    <span class="profile-icon" onclick="toggleDropdown()">👤</span>
                    <div class="profile-dropdown" id="profile-dropdown" style="display:none">
                        <p id="profile-name">Hi!</p>
                        <a href="/dashboard">My Orders</a>
                        <a href="/wishlist">My Wishlist ❤️</a>
                        <a onclick="logout()">Logout</a>
                    </div>
                </div>
            </div>

        </nav>
    </header>
    <h2>MyCart</h2>
    <div id="cart-items"></div>
    <div id="cart-total"></div>
    <button class="checkout-btn" onclick="checkout()">Checkout</button>
    <script src="/static/js/cart.js"></script>
</body>
</html>
