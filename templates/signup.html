<!DOCTYPE html>
<html>
<head>
    <title>Signup</title>
    <link rel="stylesheet" href="/static/css/auc.css">
</head>
<body>
    <div class="container">
        <h2>Create Account</h2>
        
        <!-- signup form -->
        <div id="signup-form">
            <input type="text" id="name" placeholder="Enter Your Name">
            <input type="email" id="email" placeholder="Enter Your Email">
            <input type="password" id="password" placeholder="Enter Your Password">
            <button onclick="sendOTP()">Send OTP</button>
            <p>Already Have an Account <a href="/login">Login</a></p>
        </div>

        <!-- otp form - hidden by default -->
        <div id="otp-form" style="display:none">
            <h3>Enter OTP sent to your email</h3>
            <input type="number" id="otp" placeholder="Enter 6 digit OTP">
            <button onclick="verifyAndSignup()">Verify & Create Account</button>
        </div>
    </div>
    <script src="/static/js/auc.js"></script>
</body>
</html>
